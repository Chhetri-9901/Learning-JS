<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>

  <div class="controls">
    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="default-padding" min="10" max="200" value="10" data-sizing="px">

    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="default-blur" min="0" max="25" value="0" data-sizing="px">

    <label for="base">Base Color</label>
    <input id="base" type="color" name="default-background" value="#ffc600">
  </div>

  <img src="reference_image.jpg">

  <style>
    /*
      misc styles, nothing to do with CSS variables
    */
    :root {
      --default-background: #1cc24e;
      --default-padding: 10px;
      --default-blur: 0px;
    }

    body {
      text-align: center;
      background: #193549;
      color: white;
      font-family: 'helvetica neue', sans-serif;
      font-weight: 100;
      font-size: 50px;
    }
    
    img {
      width: -webkit-fill-available;
      background-color: var(--default-background);
      padding: var(--default-padding);
      filter: blur(var(--default-blur));
    }

    .hl {
      color: var(--default-background);
    }

    .controls {
      margin-bottom: 50px;
    }

    input {
      width: 100px;
    }
  </style>

  <script>
  </script>

</body>

<script src="script.js"></script>

</html>
